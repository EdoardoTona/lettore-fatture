name: Windows
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'packaging/windows/**', 'Directory.Build.props', 'LettoreFatture.slnx', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'packaging/windows/**', 'Directory.Build.props', 'LettoreFatture.slnx', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Core and bridge tests
        run: dotnet test tests/Fatture.Tests -c Release
      - name: Portable Windows app
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - name: Native PDF and app lifecycle
        shell: pwsh
        run: ./packaging/windows/verify.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: LettoreFatture-win-x64
          path: artifacts/LettoreFatture-win-x64.zip
